# =====================================================================
# SmartCab Java Backend — application.properties
# =====================================================================
# Reads DATABASE_URL from the environment if present (Supabase / Render).
# Otherwise falls back to a file-based H2 database that survives restarts
# on a Render Persistent Disk (or your local machine).
# =====================================================================

# ---------- Active profile selection ----------
# When DATABASE_URL is set, "prod" profile takes over and uses Postgres.
# Otherwise "default" uses the H2 file DB.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

# ---------- Server ----------
server.port=${PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ---------- JPA shared ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.sql.init.continue-on-error=true
