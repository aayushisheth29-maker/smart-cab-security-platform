# Production profile — Supabase (or any) PostgreSQL.
#
# Render / Heroku style: a single DATABASE_URL like
#   postgresql://user:pass@host:5432/db
# We translate that into Spring's separate url/username/password fields
# in a @Configuration class, so this file stays simple.

spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP pool tuned for free-tier usage
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=600000

# SSL — Supabase requires SSL by default
spring.datasource.hikari.data-source-properties.sslmode=require
spring.datasource.hikari.data-source-properties.ApplicationName=smartcab-core

# Don't fail the whole boot if the DB is briefly unreachable
spring.datasource.hikari.initialization-fail-timeout=-1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.sql.init.continue-on-error=true

# Logging
logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework.web=INFO
logging.level.com.zaxxer.hikari=INFO
logging.level.com.smartcab=INFO
logging.level.org.springframework.boot.web.embedded.tomcat=INFO

# Server must bind to the port Render gives us
server.port=${PORT:8080}
