# Production profile — Supabase (or any) PostgreSQL via DATABASE_URL.
# Render sets DATABASE_URL automatically when you link a Postgres / Supabase DB.
# We also accept the standard JDBC variables in case they are set separately.

# DATABASE_URL looks like: postgresql://user:pass@host:port/db
# Spring needs jdbc:postgresql://... and a separate username/password
spring.datasource.url=${JDBC_URL:jdbc:${DATABASE_URL}}
spring.datasource.username=${JDBC_USERNAME:${DATABASE_USERNAME:postgres}}
spring.datasource.password=${JDBC_PASSWORD:${DATABASE_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP pool tuned for serverless-ish free-tier usage
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=600000

# SSL — Supabase requires SSL by default; Render's own DBs do too
spring.datasource.hikari.data-source-properties.sslmode=${DB_SSLMODE:require}
spring.datasource.hikari.data-source-properties.ApplicationName=smartcab-core
