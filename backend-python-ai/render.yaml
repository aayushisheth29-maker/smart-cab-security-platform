services:
  - type: web
    name: smartcab-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: rm -rf __pycache__ && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
