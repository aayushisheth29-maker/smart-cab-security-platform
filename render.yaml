# Render Blueprint — SmartCab backend (FastAPI)
# Deploy: Render Dashboard → New → Blueprint → select this repo.
# The service runs from backend-python-ai/ and the first 15-min boot
# automatically seeds demo drivers / Aayushi's sample rides.
#
# After deploying:
#   1. Copy the generated SMARTCAB_ADMIN_KEY (shown once in Render).
#   2. Set the frontend's VITE_API_URL to https://<your-service>.onrender.com
#      in Vercel, and add the Vercel URL to SMARTCAB_CORS_ORIGINS below.
services:
  - type: web
    name: smartcab-backend
    runtime: python
    rootDir: backend-python-ai
    buildCommand: pip install -r requirements.txt
    startCommand: rm -rf __pycache__ && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      # Secrets are auto-generated once and never shown again.
      # Replace SMARTCAB_CORS_ORIGINS with your real Vercel URL in production:
      #   SMARTCAB_CORS_ORIGINS=https://smart-cab-security-platform.vercel.app
      - key: SMARTCAB_SECRET_KEY
        generateValue: true
        sync: false
      - key: SMARTCAB_ADMIN_KEY
        generateValue: true
        sync: false
      - key: SMARTCAB_EVIDENCE_KEY
        generateValue: true
        sync: false
      - key: SMARTCAB_CORS_ORIGINS
        value: "*"
      - key: SMARTCAB_DEBUG
        value: "false"
      # Optional: Postgres persistence (Supabase pooler URL).
      - key: DATABASE_URL
        sync: false
      # Optional: real SMS to emergency contacts (set all three).
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
